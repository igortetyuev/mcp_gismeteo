[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-gismeteo"
version = "0.1.0"
description = "MCP server that scrapes gismeteo.ru for weather forecasts"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]

[project.scripts]
mcp-gismeteo = "mcp_gismeteo.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gismeteo"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit gismeteo.ru over the network (deselect with '-m \"not live\"')",
]
